[project]
name = "skillroute"
version = "0.6.0"
description = "SkillRoute by JEStats: local-first skill catalog and router for coding agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "JEStats" }, { name = "Eric Hare" }]
keywords = ["agents", "skills", "routing", "mcp", "catalog"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
# Deliberately empty. Routing, indexing, search, stats, and harness setup are
# stdlib-only; fastapi and uvicorn are needed by `skillroute ui` alone and live
# in the `ui` extra so a plain install stays dependency-free. This is not
# cosmetic: fastapi pulls pydantic-core, a Rust extension, which every install
# that never opens the UI would otherwise have to fetch or compile.
dependencies = []

[project.optional-dependencies]
ui = [
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
]
dev = [
    "httpx>=0.27.0",
    "mypy>=2.3.0",
    "pytest>=8.0.0",
    "ruff>=0.16.2",
    "skillroute[ui]",
]

[project.urls]
Homepage = "https://jestats.io"
Repository = "https://github.com/jestatsio/skillroute"
Issues = "https://github.com/jestatsio/skillroute/issues"
Changelog = "https://github.com/jestatsio/skillroute/blob/main/CHANGELOG.md"

[project.scripts]
skillroute = "skillroute.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
source = ["skillroute"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
files = ["src/skillroute"]
python_version = "3.11"

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
