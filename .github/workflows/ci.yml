name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          cache-suffix: python-${{ matrix.python-version }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify lockfile is up to date
        run: uv lock --check

      - name: Run tests with coverage
        run: uv run --frozen --extra dev pytest --cov=skillroute --cov-report=term-missing --cov-fail-under=80

      - name: Run lint
        run: uv run --frozen --extra dev ruff check .

      - name: Run type check
        run: uv run --frozen --extra dev mypy

      - name: Run example golden routes
        run: uv run --frozen --extra dev skillroute eval run --fresh --index-root examples/skills --cases examples/evals/golden_routes.json

      - name: Audit Python dependencies
        run: |
          uv export --frozen --no-emit-project --no-hashes --format requirements-txt -o requirements-audit.txt
          uvx pip-audit --no-deps -r requirements-audit.txt

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck web
        working-directory: web
        run: npm run typecheck

      - name: Lint web
        working-directory: web
        run: npm run lint

      - name: Test web
        working-directory: web
        run: npm run test

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Audit web dependencies
        working-directory: web
        run: npm audit --audit-level=high

  mcp:
    name: MCP
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          cache-suffix: mcp

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install MCP dependencies
        working-directory: mcp
        run: npm ci

      - name: Build MCP server
        working-directory: mcp
        run: npm run build

      - name: Typecheck MCP server
        working-directory: mcp
        run: npm run typecheck

      - name: Test MCP server
        working-directory: mcp
        run: npm test

      - name: Verify MCP package contents
        working-directory: mcp
        run: npm pack --dry-run

      - name: Audit MCP dependencies
        working-directory: mcp
        run: npm audit --audit-level=high

      - name: Smoke test MCP tools
        working-directory: mcp
        run: npm run smoke

  trust:
    name: Trust (toolprint)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install MCP dependencies
        working-directory: mcp
        run: npm ci

      - name: Build MCP server
        working-directory: mcp
        run: npm run build

      # SkillRoute ships an MCP server and a library of skill bundles, so it
      # gates both against its own committed toolprint.lock. If a tool
      # description or a SKILL.md body changes, this fails and the lockfile diff
      # goes through review. See docs/security.md.
      # Pinned: `--skills` requires toolprint >= 0.3.0, and pinning keeps a
      # future toolprint release from turning this gate red on its own.
      - name: Verify MCP server capabilities against toolprint.lock
        run: npx --yes toolprint@0.3.0 scan --config toolprint.mcp.json --fail-on high --no-color

      - name: Verify example skill bundles against toolprint.lock
        run: npx --yes toolprint@0.3.0 scan --skills examples/skills --fail-on high --no-color

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          cache-suffix: package

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build sdist and wheel
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Verify wheel bundles the web UI
        run: unzip -l dist/*.whl | grep -q "skillroute/_web/index.html"

      - name: Validate dsh plugin bundle
        working-directory: dsh-plugin
        run: |
          node -e "const p=require('./package.json'); const fs=require('fs'); if(!p.dsh?.bundle?.patch) throw new Error('missing dsh.bundle.patch'); if(!fs.existsSync(p.dsh.bundle.patch)) throw new Error('patch file missing: '+p.dsh.bundle.patch); console.log('dsh-plugin bundle ok')"
          npm pack --dry-run

  dsh-plugin:
    name: dsh-plugin bundle
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Boot a real DeepSeek Harness and confirm the bundle's cordis.patch.yml
      # composes into a profile tree. Runs against dsh@latest on purpose: dsh is
      # a developer preview, so this job is the tripwire for its breaking changes
      # to the bundle/patch format.
      - name: Verify the bundle composes into a dsh profile
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: |
          rm -rf "$DSH_HOME"
          npx -y @deepseek-ai/dsh --profile web --patch dsh-plugin/cordis.patch.yml --dump-config > "$RUNNER_TEMP/composed.yml"
          grep -q "mcp-skillroute" "$RUNNER_TEMP/composed.yml"
          grep -q "@deepseek-ai/dsh-mcp-client" "$RUNNER_TEMP/composed.yml"
          grep -q "@skillroute/mcp-server" "$RUNNER_TEMP/composed.yml"
