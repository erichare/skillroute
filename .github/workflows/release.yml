name: Release

on:
  push:
    tags: ["v*"]

  # A release can half-succeed: v0.4.0 reached PyPI, the GitHub release, and
  # @skillroute/mcp-server, but @skillroute/dsh-plugin failed because it had no
  # npm trusted publisher configured. Re-running the original run does not
  # recover that -- it replays the steps that already succeeded, and every
  # publisher refuses to overwrite an existing version, so the job dies before
  # reaching the one that still needs to run. Recovery needs a dispatch that
  # targets an existing tag, which is why every publish step below is a no-op
  # when its version is already live.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. v0.4.0"
        required: true
        type: string

permissions:
  contents: read

env:
  # On a tag push this is the pushed tag; on a dispatch it is the requested one.
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # The tag is the only thing a human types here, and the version published
      # comes from package metadata, not from the tag. Without this check,
      # tagging v0.2.0 while pyproject.toml still says 0.1.0 publishes 0.1.0 to
      # PyPI under a release titled v0.2.0 -- and a PyPI version can never be
      # reused, so there is no clean recovery.
      - name: Verify the tag matches all package versions
        run: |
          tag="${RELEASE_TAG#v}"
          py=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          mcp_version=$(node -p "require('./mcp/package.json').version")
          plugin_version=$(node -p "require('./dsh-plugin/package.json').version")
          # The Claude plugin isn't published from here; the plugin directory
          # follows `main`. It's checked anyway because it pins the MCP server
          # released under this tag, and tests/test_claude_plugin.py holds that
          # pin to mcp/package.json.
          claude_version=$(node -p "require('./claude-plugin/.claude-plugin/plugin.json').version")
          echo "tag=$tag pyproject=$py mcp=$mcp_version dsh-plugin=$plugin_version claude-plugin=$claude_version"
          if [ "$tag" != "$py" ] || [ "$tag" != "$mcp_version" ] || [ "$tag" != "$plugin_version" ] || [ "$tag" != "$claude_version" ]; then
            echo "::error::Tag $RELEASE_TAG disagrees with pyproject.toml ($py), mcp/package.json ($mcp_version), dsh-plugin/package.json ($plugin_version), and/or claude-plugin/.claude-plugin/plugin.json ($claude_version)."
            exit 1
          fi

      - name: Build sdist and wheel (bundles the web UI)
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Verify wheel bundles the web UI
        run: unzip -l dist/*.whl | grep -q "skillroute/_web/index.html"

      - name: Pack MCP server tarball
        working-directory: mcp
        run: |
          npm ci
          npm pack --pack-destination ../dist

      - name: Pack dsh plugin tarball
        working-directory: dsh-plugin
        run: npm pack --pack-destination ../dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: dist/*

  github-release:
    name: Create GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: dist

      - name: Create release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refreshing its artifacts."
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

  pypi:
    name: Publish to PyPI
    # Tag pushes only. The `pypi` environment restricts deployments to `tag: v*`,
    # and a dispatch runs with the ref it was dispatched from (a branch), so on a
    # dispatch GitHub rejects this job before any step runs -- a red job that
    # never had a chance. Recovering a failed PyPI publish therefore needs a new
    # tag, not a dispatch; the npm and GitHub-release paths are the ones a
    # dispatch can repair.
    if: vars.PYPI_PUBLISH == 'true' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: release-artifacts
          path: dist

      - name: Remove non-PyPI artifacts
        run: rm -f dist/*.tgz

      - name: Publish via trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A PyPI version can never be reused, so re-publishing is always a
          # no-op rather than something worth failing the job over.
          skip-existing: true

  npm:
    name: Publish npm packages
    if: vars.NPM_PUBLISH == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # npm trusted publishing is OIDC: this replaces NPM_TOKEN entirely, so
      # there is no long-lived credential in repo secrets to leak or rotate.
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      # Trusted publishing needs npm >= 11.5.1. Node 22 bundles npm 10.x even at
      # its latest patch, so it cannot be used here; Node 24 bundles 11.17+,
      # which clears the floor without installing anything.
      #
      # Do not "fix" this by adding `npm install -g npm@latest` on Node 22: that
      # is what v0.2.0's first release attempt did, and it failed with
      # EBADENGINE because npm 12 requires Node ^22.22.2 || ^24.15.0 while
      # setup-node had pinned 22.14.0.
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # These guards are inline on purpose. A dispatch checks out the tag being
      # published, so anything read from the working tree is the tree as of that
      # tag -- a helper script added after it simply is not there. Keeping the
      # logic in the workflow means it always matches the workflow being run.
      - name: Publish MCP server
        working-directory: mcp
        run: |
          npm ci
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on the registry; skipping publish."
          else
            echo "Publishing $name@$version"
            npm publish
          fi

      - name: Publish dsh plugin
        working-directory: dsh-plugin
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on the registry; skipping publish."
          else
            echo "Publishing $name@$version"
            npm publish
          fi
